# ============================================================
# NETLIFY - Configuração de deploy
# ------------------------------------------------------------
# No painel do Netlify (ao importar o repositório do GitHub):
#   - Build command:  (deixe vazio)
#   - Publish directory:  .
# ============================================================

[build]
  publish = "."
  command = "npm run build"

# O aplicativo não usa rotas virtuais. Assets ausentes devem retornar 404,
# nunca index.html, para o service worker não guardar HTML como CSS/JS.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/pwa/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=UTF-8"
    Cache-Control = "no-cache"
